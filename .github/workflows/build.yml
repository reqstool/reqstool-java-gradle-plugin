on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      artifact-name:
        description: >
          Name to upload the build output under. The release flow runs this
          workflow twice in one run -- once on the branch, once on the tag -- and
          upload-artifact rejects a duplicate name.
        required: false
        type: string
        default: "dist"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  lint:
    uses: reqstool/.github/.github/workflows/java-lint.yml@6340edb1ebc6c9cbeb3f533738ba8f9672a4d313 # 1.2.3
    with:
      build-tool: gradle

  build:
    needs: lint
    uses: reqstool/.github/.github/workflows/java-build-gradle.yml@6340edb1ebc6c9cbeb3f533738ba8f9672a4d313 # 1.2.3
    with:
      ref: ${{ inputs.ref }}
      artifact-name: ${{ inputs.artifact-name || 'dist' }}
      post-test-command: |
        mkdir -p build/reqstool
        {
          echo "# yaml-language-server: \$schema=https://raw.githubusercontent.com/reqstool/reqstool-client/main/src/reqstool/resources/schemas/v1/annotations.schema.json"
          yq eval-all '. as $item ireduce ({}; . * $item )' \
            build/generated/sources/annotationProcessor/java/main/resources/annotations.yml \
            build/generated/sources/annotationProcessor/java/test/resources/annotations.yml | grep -v "^#"
        } > build/reqstool/annotations.yml

  reqstool:
    needs: build
    uses: reqstool/.github/.github/workflows/common-reqstool-verify.yml@6340edb1ebc6c9cbeb3f533738ba8f9672a4d313 # 1.2.3
    with:
      build-artifact: ${{ inputs.artifact-name || 'dist' }}-build

  smoke:
    needs: build
    uses: reqstool/.github/.github/workflows/java-smoke.yml@6340edb1ebc6c9cbeb3f533738ba8f9672a4d313 # 1.2.3
    with:
      command: ./gradlew --console=plain build

  validate-openspec:
    uses: reqstool/.github/.github/workflows/common-validate-openspec.yml@6340edb1ebc6c9cbeb3f533738ba8f9672a4d313 # 1.2.3

  ci:
    if: ${{ always() }}
    needs: [lint, build, reqstool, smoke, validate-openspec]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c 'import json,sys; r={k:v["result"] for k,v in json.load(sys.stdin).items()}; print(r); sys.exit(0 if all(v=="success" for v in r.values()) else 1)'
